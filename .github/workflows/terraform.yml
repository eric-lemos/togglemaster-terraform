name: Terraform Ops

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tftest.hcl"
      - ".terraform.lock.hcl"
      - "helm/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tftest.hcl"
      - ".terraform.lock.hcl"
      - "helm/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: "Apply Infra"
        type: choice
        options:
          - "Apply Infra"
          - "Apply Helm"
          - "Destroy"

permissions:
  contents: read

concurrency:
  group: terraform-ops
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_rds_instance_passwords: ${{ secrets.TF_VAR_RDS_INSTANCE_PASSWORDS }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.select.outputs.infra }}
      helm: ${{ steps.select.outputs.helm }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Terraform stacks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$OPERATION" in
              "Apply Infra") printf 'infra=true\nhelm=false\n' >> "$GITHUB_OUTPUT" ;;
              "Apply Helm")  printf 'infra=false\nhelm=true\n' >> "$GITHUB_OUTPUT" ;;
              "Destroy")     printf 'infra=false\nhelm=false\n' >> "$GITHUB_OUTPUT" ;;
              *) echo "Unsupported operation: $OPERATION" >&2; exit 1 ;;
            esac
            exit 0
          fi
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -w -t tree /dev/null)"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          infra=false
          helm=false
          while IFS= read -r -d '' path; do
            case "$path" in
              helm/*) helm=true ;;
              .github/workflows/terraform.yml | scripts/backend_bucket_name.sh)
                infra=true
                helm=true
                ;;
              *.tf | *.tfvars | *.tftest.hcl | .terraform.lock.hcl | scripts/*)
                infra=true
                ;;
            esac
          done < "$changed_files"
          printf 'infra=%s\nhelm=%s\n' "$infra" "$helm" >> "$GITHUB_OUTPUT"

  validate-infra:
    name: Validate Infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  validate-helm:
    name: Validate Helm
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Check formatting
        run: terraform -chdir=helm fmt -check -recursive
      - name: Initialize Helm Terraform stack
        run: terraform -chdir=helm init -backend=false
      - name: Validate Helm Terraform stack
        run: terraform -chdir=helm validate
      - name: Test Helm observability configuration
        run: terraform -chdir=helm test

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan-infra:
    name: Plan Infrastructure
    needs: [changes, validate-infra]
    if: needs.changes.outputs.infra == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
          echo "Using Terraform backend bucket: $TF_BACKEND_BUCKET"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Create Terraform backend bucket
        run: bash scripts/create_backend_bucket.sh "$TF_BACKEND_BUCKET" "$AWS_REGION"
      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="region=$AWS_REGION"
      - name: Generate infrastructure plan
        run: terraform plan -input=false -out=tfplan
      - name: Generate plan checksum
        run: sha256sum tfplan > tfplan.sha256
      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-infra-plan
          path: |
            tfplan
            tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  plan-helm:
    name: Plan Helm
    needs: [changes, validate-helm]
    if: needs.changes.outputs.helm == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Initialize infrastructure state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="region=$AWS_REGION"
      - name: Initialize Helm Terraform stack
        run: |
          terraform -chdir=helm init -input=false \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="region=$AWS_REGION"
      - name: Generate Helm plan
        run: |
          export TF_VAR_aws_region="$AWS_REGION"
          export TF_VAR_eks_cluster_name="$(terraform output -raw eks_cluster_name)"
          terraform -chdir=helm plan -input=false -out=helm.tfplan
      - name: Generate plan checksum
        run: sha256sum helm/helm.tfplan > helm.tfplan.sha256
      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-helm-plan
          path: |
            helm/helm.tfplan
            helm.tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  apply-infra:
    name: Apply Infrastructure
    needs: [plan-infra, security]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'Apply Infra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Download infrastructure plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-infra-plan
          path: .
      - name: Verify plan checksum
        run: sha256sum --check tfplan.sha256
      - name: Apply infrastructure plan
        run: terraform apply -input=false tfplan

  apply-helm:
    name: Apply Helm
    needs: [plan-helm, security]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'Apply Helm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate PagerDuty integration key
        env:
          PAGERDUTY_INTEGRATION_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
        run: |
          if [[ -z "$PAGERDUTY_INTEGRATION_KEY" || "$PAGERDUTY_INTEGRATION_KEY" =~ [[:space:]] ]]; then
            echo "PAGERDUTY_INTEGRATION_KEY must be a non-empty Events API v2 integration key without whitespace." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Initialize infrastructure state
        run: terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Wait for EKS cluster
        run: |
          cluster_name="$(terraform output -raw eks_cluster_name)"
          aws eks wait cluster-active --region "$AWS_REGION" --name "$cluster_name"
      - name: Configure Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$DISCORD_WEBHOOK_URL" =~ ^https://(discord\.com|discordapp\.com)/api/webhooks/[0-9]+/[A-Za-z0-9._-]+/?$ ]]; then
            echo "DISCORD_WEBHOOK_URL must be a Discord webhook URL without /slack or query parameters." >&2
            exit 1
          fi
          cluster_name="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$cluster_name"
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          webhook_file="$(mktemp)"
          trap 'rm -f "$webhook_file"' EXIT
          printf '%s/slack' "${DISCORD_WEBHOOK_URL%/}" > "$webhook_file"
          kubectl -n observability create secret generic discord-webhook \
            --from-file="url=$webhook_file" --dry-run=client -o yaml | kubectl apply -f -
      - name: Configure PagerDuty integration
        env:
          PAGERDUTY_INTEGRATION_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$PAGERDUTY_INTEGRATION_KEY" > "$key_file"
          kubectl -n observability create secret generic pagerduty-integration \
            --from-file="routing-key=$key_file" --dry-run=client -o yaml | kubectl apply -f -
      - name: Initialize Helm Terraform stack
        run: |
          terraform -chdir=helm init -input=false \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="region=$AWS_REGION"
      - name: Download Helm plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-helm-plan
          path: .
      - name: Verify plan checksum
        run: sha256sum --check helm.tfplan.sha256
      - name: Apply Helm plan
        run: terraform -chdir=helm apply -input=false helm.tfplan

  destroy:
    name: Destroy
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'Destroy' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Ensure Terraform backend bucket exists
        run: bash scripts/create_backend_bucket.sh "$TF_BACKEND_BUCKET" "$AWS_REGION"
      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="region=$AWS_REGION"
      - name: Destroy Helm releases before EKS
        run: |
          set -euo pipefail
          state_resources="$(terraform state list)"
          if grep -q '^module\.eks\.' <<< "$state_resources"; then
            cluster_name="$(terraform output -raw eks_cluster_name)"
            aws eks describe-cluster --name "$cluster_name" --region "$AWS_REGION" >/dev/null
            export TF_VAR_aws_region="$AWS_REGION"
            export TF_VAR_eks_cluster_name="$cluster_name"
            terraform -chdir=helm init -input=false \
              -backend-config="bucket=$TF_BACKEND_BUCKET" \
              -backend-config="region=$AWS_REGION"
            helm_state="$(terraform -chdir=helm state list)"
            if [[ -n "$helm_state" ]]; then
              terraform -chdir=helm destroy -auto-approve -input=false
            fi
          fi
      - name: Cleanup Load Balancers and Kubernetes resources
        run: bash scripts/cleanup_loadbalancers.sh "${{ env.AWS_REGION }}"
      - name: Destroy infrastructure
        run: |
          if ! terraform destroy -auto-approve -input=false; then
            echo "Destroy failed; cleaning up network leftovers and retrying..."
            bash scripts/cleanup_vpc_leftovers.sh "$AWS_REGION"
            terraform destroy -auto-approve -input=false
          fi
