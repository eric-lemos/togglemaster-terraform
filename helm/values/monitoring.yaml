fullnameOverride: monitoring
additionalPrometheusRulesMap:
  togglemaster-auth: ${auth_alert_rules}
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: monitoring-ui-basic-auth
    type: Opaque
    stringData:
      auth: ${jsonencode(monitoring_basic_auth)}
      username: admin
      password: ${jsonencode(monitoring_ui_password)}
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-ui-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: ToggleMaster Observability
    hosts: []
    paths:
      - /prometheus
    pathType: Prefix
  prometheusSpec:
    routePrefix: /prometheus
    # Prometheus redirects its UI root using the externalUrl path, so it must carry the prefix.
    externalUrl: http://monitoring-prometheus.observability:9090/prometheus
    retention: 3d
    retentionSize: 2GB
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    additionalScrapeConfigs:
      - job_name: otel-application-metrics
        static_configs:
          - targets:
              - otel-gateway.observability.svc.cluster.local:8889
      # Métricas internas do collector (porta 8888 do pod, não declarada no chart)
      - job_name: otel-collector-internal
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: opentelemetry-collector
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:8888
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            target_label: collector
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
alertmanager:
  config:
    route:
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: discord-chat-ops
          matchers:
            - alertname = "ToggleMasterAuthHighErrorRate"
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
# %{ if self_healing_webhook_enabled }
          continue: true
        - receiver: auth-self-healing
          matchers:
            - alertname = "ToggleMasterAuthHighErrorRate"
            - service = "auth-service"
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 15m
# %{ endif }
    receivers:
      - name: "null"
      - name: discord-chat-ops
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/discord-webhook/url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty-integration/routing-key
            send_resolved: true
            severity: '{{ .CommonLabels.severity }}'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              description: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
              service: '{{ .CommonLabels.service }}'
# %{ if self_healing_webhook_enabled }
      - name: auth-self-healing
        webhook_configs:
          - url: https://webhook.togglemaster.svc:8443/webhook
            send_resolved: false
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/webhook/token
              tls_config:
                ca_file: /etc/alertmanager/secrets/webhook/ca.crt
              follow_redirects: false
# %{ endif }
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-ui-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: ToggleMaster Observability
    hosts: []
    paths:
      - /alertmanager
    pathType: Prefix
  alertmanagerSpec:
    secrets:
      - discord-webhook
      - pagerduty-integration
# %{ if self_healing_webhook_enabled }
      - webhook
# %{ endif }
    routePrefix: /alertmanager
    externalUrl: http://monitoring-alertmanager.observability:9093/alertmanager
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
grafana:
  adminPassword: null
  serviceMonitor:
    path: /grafana/metrics
  persistence:
    enabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: []
    path: /grafana
    pathType: Prefix
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  # Grafana 13 idles around 250Mi; 256Mi caused OOMKilled restarts (503 via ingress).
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  sidecar:
    datasources:
      uid: prometheus
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: togglemaster
          orgId: 1
          folder: ToggleMaster
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/togglemaster
  dashboards:
    togglemaster:
      ecosystem:
        json: ${togglemaster_dashboard}
      otel-collector:
        json: ${otel_collector_dashboard}
