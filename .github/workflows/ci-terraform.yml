name: Terraform CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/ci-terraform.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/ci-terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply"
        required: true
        default: false
        type: boolean
      destroy:
        description: "Destroy"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_rds_instance_passwords: ${{ secrets.TF_VAR_RDS_INSTANCE_PASSWORDS }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
          echo "Using Terraform backend bucket: $TF_BACKEND_BUCKET"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Create Terraform backend bucket
        run: bash scripts/create_backend_bucket.sh "$TF_BACKEND_BUCKET" "$AWS_REGION"

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
          -backend-config="bucket=$TF_BACKEND_BUCKET" \
          -backend-config="region=$AWS_REGION"

      - name: Generate plan
        run: terraform plan -input=false -out=tfplan

      - name: Generate plan checksum
        run: sha256sum tfplan > tfplan.sha256

      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  security:
    name: Security
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  apply:
    name: Apply
    needs:
      - plan
      - security
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true' && github.event.inputs.destroy != 'true' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
          echo "Using Terraform backend bucket: $TF_BACKEND_BUCKET"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Download approved plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan
          path: .

      - name: Verify plan checksum
        run: sha256sum --check tfplan.sha256

      - name: Apply approved plan
        run: terraform apply -input=false tfplan

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
          echo "Using Terraform backend bucket: $TF_BACKEND_BUCKET"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Cleanup Load Balancers and K8s resources
        run: bash scripts/cleanup_loadbalancers.sh "${{ env.AWS_REGION }}"

      - name: Ensure Terraform backend bucket exists
        run: bash scripts/create_backend_bucket.sh "$TF_BACKEND_BUCKET" "$AWS_REGION"

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
          -backend-config="bucket=$TF_BACKEND_BUCKET" \
          -backend-config="region=$AWS_REGION"

      - name: Destroy resources
        run: terraform destroy -auto-approve -input=false
