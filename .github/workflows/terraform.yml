name: Terraform Ops

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tftest.hcl"
      - ".terraform.lock.hcl"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tftest.hcl"
      - ".terraform.lock.hcl"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: "Apply"
        type: choice
        options:
          - "Apply"
          - "Destroy"

permissions:
  contents: read

concurrency:
  group: terraform-ops
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_rds_instance_passwords: ${{ secrets.TF_VAR_RDS_INSTANCE_PASSWORDS }}

jobs:
  validate-infra:
    name: Validate Infrastructure
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'Apply'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  security:
    name: Security
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'Apply Infra'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan-infra:
    name: Plan Infrastructure
    needs: validate-infra
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
          echo "Using Terraform backend bucket: $TF_BACKEND_BUCKET"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Create Terraform backend bucket
        run: bash scripts/create_backend_bucket.sh "$TF_BACKEND_BUCKET" "$AWS_REGION"
      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Generate infrastructure plan
        run: terraform plan -input=false -out=tfplan
      - name: Generate plan checksum
        run: sha256sum tfplan > tfplan.sha256
      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-infra-plan
          path: |
            tfplan
            tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  apply-infra:
    name: Apply Infrastructure
    needs: [plan-infra, security]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'Apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Download infrastructure plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-infra-plan
          path: .
      - name: Verify plan checksum
        run: sha256sum --check tfplan.sha256
      - name: Apply infrastructure plan
        run: terraform apply -input=false tfplan

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'Destroy' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Determine Terraform backend bucket
        run: |
          TF_BACKEND_BUCKET="$(bash scripts/backend_bucket_name.sh "$AWS_REGION")"
          echo "TF_BACKEND_BUCKET=$TF_BACKEND_BUCKET" >> "$GITHUB_ENV"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.21.2
      - name: Ensure Terraform backend bucket exists
        run: bash scripts/create_backend_bucket.sh "$TF_BACKEND_BUCKET" "$AWS_REGION"
      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Uninstall project Helm releases before EKS
        run: bash scripts/uninstall_helm.sh
      - name: Destroy infrastructure
        run: terraform destroy -auto-approve -input=false
