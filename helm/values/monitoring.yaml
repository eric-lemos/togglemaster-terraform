fullnameOverride: monitoring
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: monitoring-ui-basic-auth
    type: Opaque
    stringData:
      auth: ${jsonencode(monitoring_basic_auth)}
      username: admin
      password: ${jsonencode(monitoring_ui_password)}
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-ui-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: ToggleMaster Observability
    hosts: []
    paths:
      - /prometheus
    pathType: Prefix
  prometheusSpec:
    routePrefix: /prometheus
    # Prometheus redirects its UI root using the externalUrl path, so it must carry the prefix.
    externalUrl: http://monitoring-prometheus.observability:9090/prometheus
    retention: 3d
    retentionSize: 2GB
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    additionalScrapeConfigs:
      - job_name: otel-application-metrics
        static_configs:
          - targets:
              - otel-gateway.observability.svc.cluster.local:8889
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-ui-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: ToggleMaster Observability
    hosts: []
    paths:
      - /alertmanager
    pathType: Prefix
  alertmanagerSpec:
    routePrefix: /alertmanager
    externalUrl: http://monitoring-alertmanager.observability:9093/alertmanager
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
grafana:
  adminPassword: null
  persistence:
    enabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: []
    path: /grafana
    pathType: Prefix
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  # Grafana 13 idles around 250Mi; 256Mi caused OOMKilled restarts (503 via ingress).
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  sidecar:
    datasources:
      uid: prometheus
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: togglemaster
          orgId: 1
          folder: ToggleMaster
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/togglemaster
  dashboards:
    togglemaster:
      ecosystem:
        json: ${togglemaster_dashboard}
